<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enluminari — Ideas, Innovation, Impact.">
  <title>Enluminari</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #070f16; }
    body {
      background: linear-gradient(to top, #10202e, #070f16);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main { position: relative; }
    img {
      display: block;
      width: min(270px, calc(100vw - 32px));
      height: auto;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      object-fit: contain;
      mix-blend-mode: lighten;
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <main>
    <img src="images/logo.png" width="540" height="346"
         alt="Enluminari — Ideas, Innovation, Impact">
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('starfield');
      const context = canvas.getContext('2d');
      if (!context) return;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const stars = [];
      const tau = Math.PI * 2;
      let width = 0;
      let height = 0;
      let count = 0;
      let frame = null;
      const random = (min, max) => min + Math.random() * (max - min);

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);
        count = Math.min(400, Math.max(32, Math.round(width * height / 6000)));

        // Three of every twenty stars have a noticeable twinkle.
        while (stars.length < count) {
          const noticeable = [3, 10, 17].includes(stars.length % 20);
          // Mix a sparse uniform field with a denser upper sky.
          const y = Math.random() < 0.8
            ? 1 - Math.pow(1 - Math.random(), 0.25)
            : Math.random();
          const upperEmphasis = Math.pow(1 - y, 2);
          stars.push({
            x: Math.random(),
            y,
            radius: random(0.3, 0.75),
            opacity: noticeable ? random(0.2, 0.26) : random(0.06, 0.18),
            amplitude: noticeable
              ? random(0.1, 0.14) * (1 + 0.35 * upperEmphasis)
              : random(0.002, 0.006),
            phase: random(0, tau),
            frequency: 1 / random(10, 20)
          });
        }
        draw(performance.now());
      }

      function draw(time) {
        context.clearRect(0, 0, width, height);
        context.fillStyle = '#d2e0ef';
        const seconds = time / 1000;
        for (let i = 0; i < count; i++) {
          const star = stars[i];
          const variation = reducedMotion.matches ? 0 :
            Math.sin(seconds * tau * star.frequency + star.phase) * star.amplitude;
          // Stronger highlights at the top, with a quiet lower sky.
          const brightness = 1.2 + 1.4 * Math.pow(1 - star.y, 2);
          context.globalAlpha = Math.min(0.85, (star.opacity + variation) * brightness);
          context.beginPath();
          context.arc(star.x * width, star.y * height, star.radius, 0, tau);
          context.fill();
        }
        context.globalAlpha = 1;
      }

      function animate(time) {
        draw(time);
        frame = requestAnimationFrame(animate);
      }

      function updateMotion() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        draw(performance.now());
        if (!reducedMotion.matches && !document.hidden) {
          frame = requestAnimationFrame(animate);
        }
      }

      window.addEventListener('resize', resize);
      reducedMotion.addEventListener('change', updateMotion);
      document.addEventListener('visibilitychange', updateMotion);
      resize();
      updateMotion();
    })();
  </script>
</body>
</html>
