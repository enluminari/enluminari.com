<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enluminari — Ideas, Innovation, Impact.">
  <title>Enluminari</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #070f16; }
    body {
      background: linear-gradient(to top, #10202e, #070f16);
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    img {
      display: block;
      width: min(270px, calc(100vw - 32px));
      height: auto;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      object-fit: contain;
      mix-blend-mode: lighten;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/logo.png" width="540" height="346"
         alt="Enluminari — Ideas, Innovation, Impact">
  </main>
</body>
</html>
